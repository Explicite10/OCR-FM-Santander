# Forma Migratoria OCR: API (FastAPI + PaddleOCR) que usa un Ollama con Qwen3-VL.
#
#   Compartiendo el Ollama de ine-ocr (misma GPU de 8 GB, un solo modelo cargado):
#       OLLAMA_NETWORK=ine-ocr_default y OLLAMA_NETWORK_EXTERNAL=true en .env
#       docker compose up -d --build
#   Con su propio Ollama (GPU NVIDIA):  docker compose --profile ollama up -d --build
#
# La API queda en http://SERVIDOR:18475 (cambiar con API_PORT en .env).

name: fm-ocr

services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["ollama", "pull", "${VLM_MODEL:-qwen3-vl:8b-instruct}"]
    restart: "no"

  api:
    build: .
    image: fm-ocr-api:latest
    restart: unless-stopped
    ports:
      - "${API_PORT:-18475}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      VLM_BACKEND: ${VLM_BACKEND:-ollama}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://ollama:11434}
      VLM_MODEL: ${VLM_MODEL:-qwen3-vl:8b-instruct}
    networks:
      - default
      - vlm

  # Lote de pruebas: docker compose run --rm lote lote/pdfs --salida lote/resultados --concurrencia 3
  lote:
    image: fm-ocr-api:latest
    profiles: ["lote"]
    env_file:
      - path: .env
        required: false
    environment:
      VLM_BACKEND: ${VLM_BACKEND:-ollama}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://ollama:11434}
      VLM_MODEL: ${VLM_MODEL:-qwen3-vl:8b-instruct}
    volumes:
      - ${LOTE_DIR:-./lote}:/app/lote
    networks:
      - default
      - vlm
    entrypoint: ["python", "-m", "scripts.procesar_lote"]
    restart: "no"

networks:
  vlm:
    name: ${OLLAMA_NETWORK:-fm-ocr_default}
    external: ${OLLAMA_NETWORK_EXTERNAL:-false}

volumes:
  ollama-models:
